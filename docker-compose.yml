# ── STIX Threat Intelligence Platform — Docker Compose ──────────────────────
# This project uses SQLite (not PostgreSQL). The only services needed are:
#   backend  → FastAPI on port 8000
#   frontend → React/Vite on port 5173
#
# Usage:
#   docker-compose up --build          # first run
#   docker-compose up                  # subsequent runs
#   docker-compose down                # stop

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stix_backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Only mount directories that need write-access at runtime.
      # Avoid mounting the entire project root (exposes .env, .git, .venv).
      - ./database:/app/database
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data
      # Mount source code read-only for hot-reload in development.
      # Remove this line in production (use COPY in Dockerfile instead).
      - ./app:/app/app:ro
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:18-alpine
    container_name: stix_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules   # persist node_modules across restarts
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    # npm ci is faster and more deterministic than npm install.
    # node_modules volume mount prevents re-install on every restart.
    command: sh -c "npm ci --prefer-offline 2>/dev/null || npm install && npm run dev -- --host"
    depends_on:
      - backend

# Named volume for frontend node_modules (prevents re-install on every start)
volumes:
  frontend_node_modules: